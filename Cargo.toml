[package]
name = "turing-pattern"
version = "0.1.0"
edition = "2024"
description = "Show random Gray–Scott reaction-diffusion patterns in the terminal via chafa"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
gif = { version = "0.14.2", default-features = false, features = ["std"] }
png = "0.18.1"
rayon = "1.12.0"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
